<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <!-- BC Sun / Wavy lines emblem -->
  <g transform="translate(25, 20)">
    <!-- Sun rays -->
    <path d="M 45 45 L 45 15" stroke="#F5A800" stroke-width="4" stroke-linecap="round"/>
    <path d="M 45 45 L 25 20" stroke="#F5A800" stroke-width="4" stroke-linecap="round"/>
    <path d="M 45 45 L 65 20" stroke="#F5A800" stroke-width="4" stroke-linecap="round"/>
    <path d="M 45 45 L 12 32" stroke="#F5A800" stroke-width="4" stroke-linecap="round"/>
    <path d="M 45 45 L 78 32" stroke="#F5A800" stroke-width="4" stroke-linecap="round"/>
    <!-- Half sun body -->
    <path d="M 15 45 A 30 30 0 0 1 75 45 Z" fill="#F5A800"/>
    <!-- Blue waves -->
    <path d="M 10 48 Q 28 42 45 48 T 80 48" fill="none" stroke="#002D62" stroke-width="4"/>
    <path d="M 10 56 Q 28 50 45 56 T 80 56" fill="none" stroke="#002D62" stroke-width="4"/>
    <path d="M 10 64 Q 28 58 45 64 T 80 64" fill="none" stroke="#002D62" stroke-width="4"/>
  </g>
  <!-- Text BRITISH COLUMBIA -->
  <text x="125" y="55" font-family="'Times New Roman', 'Georgia', serif" font-size="24" font-weight="bold" fill="#002855" letter-spacing="1">BRITISH</text>
  <text x="125" y="76" font-family="'Times New Roman', 'Georgia', serif" font-size="20" font-weight="bold" fill="#002855" letter-spacing="1.5">COLUMBIA</text>
</svg>
